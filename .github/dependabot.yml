version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - '*'
    reviewers:
      - 'austintoddj'
    labels:
      - 'github-actions'
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
